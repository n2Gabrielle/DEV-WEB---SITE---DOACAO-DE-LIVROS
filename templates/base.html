<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Livros Vai na Web{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container py-2">
                <a class="navbar-brand d-flex align-items-center gap-3" href="{{ url_for('main.index') }}">
                    <img class="brand-logo" src="{{ url_for('static', filename='assets/logo.png') }}" alt="Livro aberto">
                    <span>Livros Vai na Web</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#site-menu" aria-controls="site-menu" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="site-menu">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.listar_livros') }}">Livros doados</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.doacao') }}">Quero doar</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.sobre') }}">Sobre</a></li>
                    </ul>
                    <form class="search-box d-flex ms-lg-4" role="search" method="get" action="{{ url_for('main.listar_livros') }}">
                        <input class="form-control" type="search" name="q" value="{{ request.args.get('q', '') }}" placeholder="O que você procura" aria-label="Pesquisar livros">
                        <button class="btn btn-light" type="submit" aria-label="Pesquisar">⌕</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container pt-3" aria-live="polite">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>
                {% endfor %}
            {% endwith %}
        </div>
        {% block content %}{% endblock %}
    </main>

    <footer class="py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <strong>4002-8922</strong>
            <div class="d-flex gap-3">
                <a href="#" aria-label="Facebook"><img class="social-icon" src="{{ url_for('static', filename='assets/facebook.png') }}" alt=""></a>
                <a href="#" aria-label="Instagram"><img class="social-icon" src="{{ url_for('static', filename='assets/instagram.png') }}" alt=""></a>
                <a href="#" aria-label="YouTube"><img class="social-icon" src="{{ url_for('static', filename='assets/youtube.png') }}" alt=""></a>
            </div>
            <small>Projeto educativo Livros Vai na Web</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
