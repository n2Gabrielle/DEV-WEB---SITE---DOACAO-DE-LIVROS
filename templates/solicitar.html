{% extends "base.html" %}

{% block title %}Solicitar {{ livro.titulo }} | Livros Vai na Web{% endblock %}

{% block content %}
<section class="page-banner">
    <div class="container"><h1>Solicitar um livro</h1><p class="lead mb-0">{{ livro.titulo }} — {{ livro.autor }}</p></div>
</section>
<section class="container">
    <div class="form-panel card border-0 shadow p-4 p-md-5">
        <h2 class="h3 mb-3">Seus dados para contato</h2>
        <form method="post" action="{{ url_for('main.solicitar_livro', livro_id=livro.id) }}">
            <div class="mb-3"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" name="nome" maxlength="120" required></div>
            <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" type="email" maxlength="255" required></div>
            <div class="mb-3"><label class="form-label" for="telefone">Telefone (opcional)</label><input class="form-control" id="telefone" name="telefone" maxlength="30"></div>
            <div class="mb-3"><label class="form-label" for="mensagem">Mensagem (opcional)</label><textarea class="form-control" id="mensagem" name="mensagem" rows="3"></textarea></div>
            <button class="btn btn-primary" type="submit">Enviar solicitação</button>
        </form>
    </div>
</section>
{% endblock %}
